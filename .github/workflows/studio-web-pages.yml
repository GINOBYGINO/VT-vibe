name: Deploy Studio ops UI

on:
  push:
    branches: [main]
    paths:
      - "studio/web/**"
      - ".github/workflows/studio-web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/web/package-lock.json
      - name: Build static ops UI
        working-directory: studio/web
        run: |
          npm ci
          npm run build
        env:
          # Empty: phone sets local Tunnel URL in the「連本機」panel.
          VITE_API_BASE: ""
      - uses: actions/upload-pages-artifact@v3
        with:
          path: studio/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
